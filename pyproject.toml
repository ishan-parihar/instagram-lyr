[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-lyr"
version = "0.1.1"
description = "Instagram MCP server using browser cookies and httpx"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.1.1",
    "inquirer>=3.4.0",
    "obscura-core @ git+https://github.com/ishan-parihar/obscura-core.git",
    "Pillow>=10.0.0",
    "instagrapi>=2.0.0",
    "curl-cffi>=0.16.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
instagram-lyr = "instagram_mcp_server.cli_wrapper:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instagram_mcp_server*"]



[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Curated rule set (family convention): the codebase is written against
# E/F/I/B/UP — not ruff's unbounded default. Explicit select keeps the CI
# gate deterministic instead of tracking whatever rules new ruff versions
# enable by default.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastMCP dependency-injection pattern (ctx: Context = CurrentContext())
    "BLE001", # error handler deliberately catches all exceptions
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
